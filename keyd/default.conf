# keyd 系统级改键 — 平替 macOS 的 Karabiner
# 本文件不走 stow（keyd 只读 /etc/keyd/）。
# 安装：Ubuntu 22.04 / Pop!_OS 22.04 源里没有 keyd 包（23.10+ 才收录），需源码编译：
#   sudo apt install build-essential git
#   git clone https://github.com/rvaiya/keyd /tmp/keyd && cd /tmp/keyd && make
#   sudo make install
#   sudo mkdir -p /etc/keyd
#   sudo cp ~/dotfiles/keyd/default.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
# 排错：sudo keyd monitor 显示的是 keyd 的输出事件（<键名> down/up 里的
# down/up 是按下/松开事件类型，不是方向键）；验证映射效果请看真实应用里的光标。
# 文档：https://github.com/rvaiya/keyd

[ids]
*

[main]
# Caps：按住 = Ctrl，单击 = Esc
# （对应 Karabiner 的 caps→left_control + left_control 单击→escape 两条规则的合成）
capslock = overload(control, esc)
leftcontrol = overload(control, esc)

# 右侧 Cmd 位（同一枚物理键：mac 上是 Command，Windows 键帽上标 Alt）。
# WHY 用层而不是 "rightalt+h" 形式：keyd 默认把 rightalt/rightmeta 别名成
# altgr/meta 层动作，按住时激活的是层，[main] 里的修饰键前缀绑定不会命中。
rightalt = layer(rdir)
rightmeta = layer(rdir)

[rdir]
h = left
j = down
k = up
l = right
comma = home
dot = end

# 对应 Karabiner 的 Right Shift → Ctrl+Space
rightshift = C-space
