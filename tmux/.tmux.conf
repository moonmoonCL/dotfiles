##### =========================
##### 基础设置
##### =========================

set -g mouse on
set -g history-limit 100000
set -g extended-keys on
set -g extended-keys-format csi-u

set -g default-shell /opt/homebrew/bin/fish
setw -g mode-keys vi

set -g status-position top

set -g base-index 1
setw -g pane-base-index 1

# Option + 数字：直接切换 tmux window/tab（无需 Prefix）
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7


##### =========================
##### key 前缀
##### =========================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### =========================
##### 分屏继承当前目录
##### =========================

# 默认分屏快捷键继承目录
unbind '/'
bind '/' split-window -h -c "#{pane_current_path}"
unbind %
bind % split-window -v -c "#{pane_current_path}"

# - 上下分屏 / _ 左右分屏
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"


##### =========================
##### popup（弹出式浮窗）
##### =========================

bind g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "lazygit"
bind t display-popup -E -w 80% -h 70% -d "#{pane_current_path}"


##### =========================
##### agent 铃声监控
##### =========================

# 非当前窗口的 agent 响铃时，状态栏高亮该窗口名
# （黄底样式在下方状态栏段的 window_bell_flag 条件里渲染）
setw -g monitor-bell on
set -g bell-action other


##### =========================
##### 状态栏外观（Tokyo Night）
##### =========================

set -g status-style "bg=default,fg=#a9b1d6"
set -g status-left-length 30
set -g status-left "#[fg=#7aa2f7,bg=default]#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=default]#[default] "
set -g status-right-length 40
set -g status-right "#{?client_prefix,#[fg=#15161e#,bg=#e0af68#,bold] PREFIX #[default] ,}#[fg=#565f89]%m-%d #[fg=#a9b1d6,bold]%H:%M "
setw -g window-status-separator " "
setw -g window-status-format "#{?window_bell_flag,#[fg=#15161e#,bg=#e0af68#,bold] #I #W ,#[fg=#565f89] #I #W }"
setw -g window-status-current-format "#[fg=#292e42,bg=default]#[fg=#7aa2f7,bg=#292e42,bold]#I #W#[fg=#292e42,bg=default]#[default]"
set -g message-style "fg=#7aa2f7,bg=#292e42"


##### =========================
##### 重新加载配置
##### =========================

bind r source-file ~/.tmux.conf \; display "Config reloaded"

##### =========================
##### pane resize（生产力核心）
##### =========================

bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5


##### =========================
##### window / session 管理
##### =========================

# rename window
bind , command-prompt "rename-window %%"

# window list
bind w choose-window

# session list
bind S choose-session

# kill pane / window
bind x kill-pane
bind X kill-window

##### ==========================================
##### IDE Workspace Layout
##### ==========================================

# 主工作区宽度
# 推荐:
# 70%  MacBook
# 75%  外接显示器
# 80%  超宽屏

set -g main-pane-width 75%

# 创建工作台
#
# ┌──────────────────────────────┬─────────┐
# │                              │ Pane 1  │
# │                              ├─────────┤
# │           MAIN               │ Pane 2  │
# │                              ├─────────┤
# │                              │ Pane 3  │
# └──────────────────────────────┴─────────┘
#
# Prefix + W

bind-key W run-shell '
tmux split-window -h -c "#{pane_current_path}"
tmux select-pane -R
tmux split-window -v -c "#{pane_current_path}"
tmux select-layout main-vertical
tmux select-pane -L
'

# Pane 编号显示

set -g pane-border-status top
set -g pane-border-format " #{pane_index} "

# 更明显的活动 Pane

set -g pane-active-border-style fg=yellow
set -g pane-border-style fg=colour240


##### =========================
##### pane 同步（调试/多服务）
##### =========================

bind y setw synchronize-panes


##### =========================
##### plugin manager (TPM)
##### =========================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# copy-mode 中 y 复制到系统剪贴板
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# 自动保存 session（continuum）
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'


##### =========================
##### TPM 初始化
##### =========================

run '~/.tmux/plugins/tpm/tpm'
