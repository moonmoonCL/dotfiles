# kitty — Linux 侧终端（平替 macOS 的 Ghostty）
# 逐项对应关系：font/font-size/background-opacity/copy-on-select/shell-integration
# 见 llmdoc/architecture/terminal-runtime-integration.md

font_family      JetBrainsMono Nerd Font
font_size        15.0

background_opacity 0.92

copy_on_select   yes

# fish 用绝对路径启动。WHY：从桌面启动的 kitty 继承的 PATH 不含 Homebrew，
# 写 `shell fish` 按名字找会报 "Failed to launch child: fish"。
# apt 安装的 fish 改成 /usr/bin/fish；chsh 完成并重新登录桌面后，也可删掉本行
# 让 kitty 走默认的 $SHELL（登录 shell）。
shell            /home/linuxbrew/.linuxbrew/bin/fish

# 可选：复刻 macOS 上 Karabiner 的「Ghostty 内 Esc = tmux 前缀 C-a」规则。
# 启用后物理 Esc 发送 Ctrl+A，必须配合 keyd 的「Caps 点按 = Esc」使用，
# 否则 nvim 里将没有 Esc。首装建议先用默认行为，习惯后再打开下一行：
# map escape send_text all \x01
